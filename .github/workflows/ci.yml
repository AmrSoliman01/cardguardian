name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.8'

jobs:
  test:
    name: Analyze and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart pub get
        working-directory: packages/cg_core
      - name: Privacy check (no tracking packages, no network code)
        run: ./tool/check_privacy.sh
      - name: Generated code is up to date
        run: |
          dart run build_runner build --delete-conflicting-outputs
          git diff --exit-code -- '*.g.dart'
      - name: Formatting
        run: dart format --output=none --set-exit-if-changed --line-length 120 $(git ls-files '*.dart' | grep -v -e '\.g\.dart$' -e 'l10n/app_localizations')
      - run: flutter analyze
      - name: Core tests
        working-directory: packages/cg_core
        run: dart test
      - name: App tests
        run: flutter test

  android:
    name: Android APKs
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Release signing key (optional)
        env:
          KEYSTORE_B64: ${{ secrets.CG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/cg.jks"
            echo "CG_KEYSTORE_PATH=$RUNNER_TEMP/cg.jks" >> "$GITHUB_ENV"
          fi
      - name: Build personal (SMS) and play APKs
        env:
          CG_KEYSTORE_PASSWORD: ${{ secrets.CG_KEYSTORE_PASSWORD }}
          CG_KEY_ALIAS: ${{ secrets.CG_KEY_ALIAS }}
          CG_KEY_PASSWORD: ${{ secrets.CG_KEY_PASSWORD }}
        run: |
          flutter build apk --release --flavor personal
          flutter build apk --release --flavor play
      - name: Release APKs must not request INTERNET; play must not request SMS
        run: |
          AAPT2=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          for f in personal play; do
            apk=build/app/outputs/flutter-apk/app-$f-release.apk
            echo "== $f"; "$AAPT2" dump permissions "$apk" | tee "perm-$f.txt"
            if grep -q 'android.permission.INTERNET' "perm-$f.txt"; then echo "INTERNET permission found in $f" >&2; exit 1; fi
          done
          if grep -qE 'READ_SMS|RECEIVE_SMS' perm-play.txt; then echo "SMS permission found in play build" >&2; exit 1; fi
      - uses: actions/upload-artifact@v5
        with:
          name: cardguardian-android
          path: |
            build/app/outputs/flutter-apk/app-personal-release.apk
            build/app/outputs/flutter-apk/app-play-release.apk
          retention-days: 30

  ios:
    name: iOS build (no signing)
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign
