name: cardguardian
description: "Privacy-first credit card tracker. Everything stays on the device."
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cg_core:
    path: packages/cg_core

  cryptography: ^2.9.0
  drift: ^2.35.0
  fl_chart: ^1.3.0
  file_picker: ^13.3.0
  flutter_local_notifications: ^22.3.0
  flutter_riverpod: ^3.4.0
  flutter_secure_storage: ^11.2.0
  flutter_timezone: ^5.1.0
  go_router: ^18.1.0
  intl: ^0.20.2
  local_auth: ^3.0.0
  path: ^1.9.0
  path_provider: ^2.1.5
  share_plus: ^13.3.0
  sqlite3: ^3.8.0
  timezone: ^0.11.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.17.0
  drift_dev: ^2.35.0
  flutter_lints: ^6.0.0

hooks:
  user_defines:
    sqlite3:
      # Bundle SQLCipher instead of plain SQLite so the database is encrypted at rest.
      source: sqlcipher

flutter:
  uses-material-design: true
  generate: true
